name: Pubblica documentazione

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa MkDocs Material
        run: pip install "mkdocs-material==9.7.7"

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"

      - name: Build e pubblicazione su gh-pages
        run: mkdocs gh-deploy --force --strict
