site_name: Mothership 1e - Regole
site_description: Regole di Mothership First Edition (Player's Survival Guide, Warden's Operations Manual, Shipbreaker's Toolkit, Unconfirmed Contact Reports)

theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.share
    - header.autohide

  language: it
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Passa alla modalità scura
      primary: blue grey
      accent: amber
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Passa alla modalità chiara
      primary: blue grey
      accent: amber

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [glossary.md]
  - abbr
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - tables
  - toc:
      permalink: true

validation:
  anchors: warn

